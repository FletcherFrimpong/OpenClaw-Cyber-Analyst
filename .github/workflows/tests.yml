name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is the oldest supported version. The newest Ubuntu image no
          # longer offers it, so that combination runs on Ubuntu 24.04.
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.9" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Python files compile
        run: python -m py_compile cyber-security-engineer/scripts/*.py
      - name: Shell scripts parse
        run: |
          for script in scripts/*.sh cyber-security-engineer/scripts/*.sh; do
            bash -n "$script"
          done
